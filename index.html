<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Keeper</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/form.css" />
    <link rel="stylesheet" href="styles/random-quote.css" />
    <link rel="stylesheet" href="styles/table.css" />
    <!-- Custom JS -->
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header></header>
    <main>
      <!-- FORM START -->
      <div class="form-container">
        <form action="/" class="form" id="form">
          <div class="form__control">
            <label for="quote">Quote</label>
            <input type="text" id="quote" placeholder="Enter quote..." />
          </div>
          <div class="form__control">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Enter author..." />
          </div>
          <div class="form__control">
            <label for="source">Source</label>
            <input type="text" id="source" placeholder="Enter source..." />
          </div>
          <div class="form__control">
            <button
              type="button"
              class="form__submit-btn"
              id="form__submit-btn"
            >
              Submit
            </button>
          </div>
        </form>
      </div>
      <!-- FORM END -->
      <!-- RANDOM QUOTE START -->
      <div class="random-quote-container">
        <h2 class="random-quote" id="random-quote">
          &ldquo;Don't ask for a ligher burden, ask for a stronger back!&rdquo;
        </h2>
        <p>Author: <span id="random-quote__author">Alan Turing</span></p>
        <p>Source: <span id="random-quote__source">Facebook Reels</span></p>
        <p>Added: <span id="random-quote__date-added">July 2, 2026</span></p>
        <button type="button" class="random-quote__btn" id="random-quote__btn">
          Random Quote
        </button>
      </div>
      <!-- RANDOM QUOTE END -->
      <!-- TABLE START -->
      <div class="quote-table-container">
        <table class="quote-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Quote</th>
              <th>Author</th>
              <th>Source</th>
              <th>Date Added</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="quote-table__body">
            <tr>
              <td>24212</td>
              <td>24212</td>
              <td>24212</td>
              <td>24212</td>
              <td>24212</td>
              <td class="quote-table__action">
                <button type="button" class="quote-table__edit-btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    height="24px"
                    width="24px"
                    fill="currentColor"
                  >
                    <path
                      d="M5,19H6.43L16.2,9.23L14.78,7.8L5,17.58V19ZM3,21V16.75L16.2,3.57q0.3-0.28 0.66-0.43T17.63,3q0.4,0 0.78,0.15T19.05,3.6L20.43,5q0.3,0.27 0.44,0.65T21,6.4q0,0.4-0.14,0.76T20.43,7.82L7.25,21H3ZM19,6.4L17.6,5L19,6.4ZM15.48,8.52L14.78,7.8L16.2,9.23l-0.72-0.7Z"
                    />
                  </svg>
                </button>
                <button type="button" class="quote-table__trash-btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    height="24px"
                    width="24px"
                    fill="currentColor"
                  >
                    <path
                      d="M7,21q-0.82,0-1.41-0.59T5,19V6H4V4H9V3h6V4h5V6H19V19q0,0.82-0.59,1.41T17,21H7ZM17,6H7V19H17V6ZM9,17h2V8H9v9Zm4,0h2V8H13v9ZM7,6V19V6Z"
                    />
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- TABLE END -->
    </main>
    <div class="reusable-modal" id="reusable-modal"></div>
  </body>
</html>
