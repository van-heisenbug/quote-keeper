<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <div class="add-quote-form">
        <input
          type="text"
          name="quote"
          id="quote"
          class="input"
          placeholder="Quote..."
        />
        <input
          type="text"
          name="author"
          id="author"
          placeholder="Author..."
          class="input"
        />
        <input
          type="text"
          name="source"
          id="source"
          class="input"
          placeholder="Source..."
        />
        <button type="button" class="btn" id="add-new-quote">
          Add new quote
        </button>
      </div>
      <div class="random-quote">
        <button type="button" class="btn" id="random-quote-btn">
          Show Random Quote
        </button>
        <h1 id="random-quote">asfasf</h1>
      </div>
      <div class="all-quotes">
        <ol class="quote-card">
          <li class="quote-line">sfaf</li>
          <li class="quote-line">sfaf</li>
          <li class="quote-line">sfaf</li>
          <li class="quote-line">sfaf</li>
        </ol>
      </div>
    </main>
  </body>
</html>
