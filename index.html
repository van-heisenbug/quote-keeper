<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <div class="add-quote-form">
        <button type="button" class="btn" id="add-new-quote">
          Add new quote
        </button>
        <input
          type="text"
          name="quote"
          id="quote"
          class="input"
          placeholder="Quote..."
        />
        <input
          type="text"
          name="author"
          id="author"
          placeholder="Author..."
          class="input"
        />
        <input
          type="text"
          name="source"
          id="source"
          class="input"
          placeholder="Source..."
        />
      </div>
      <!-- EDIT -->
      <div class="edit-quote-form" id="edit-quote-form">
        <input type="text" id="quote-id" class="input" disabled />
        <input
          type="text"
          name="edit-quote"
          id="edit-quote"
          class="input"
          placeholder="Quote..."
        />
        <input
          type="text"
          name="edit-author"
          id="edit-author"
          placeholder="Author..."
          class="input"
        />
        <input
          type="text"
          name="edit-source"
          id="edit-source"
          class="input"
          placeholder="Source..."
        />
        <button type="button" class="btn" id="edit-new-quote">
          Save Changes
        </button>
      </div>
      <!-- EDIT -->
      <div class="random-quote">
        <button type="button" class="btn" id="random-quote-btn">
          Show Random Quote
        </button>
        <button type="button" class="btn-sm" id="delete-all">Delete All</button>
        <h1 id="random-quote"></h1>
      </div>
      <div class="all-quotes" id="all-quotes">
        <h3>All Quotes</h3>
      </div>
    </main>
  </body>
</html>
